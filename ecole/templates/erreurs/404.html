<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Page introuvable (404)</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'vendor/fontawesome/css/all.min.css' %}">
    <style>
        body { background-color: #f4f7f6; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .error-card { max-width: 500px; width: 100%; border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .error-icon { font-size: 5rem; color: #34495e; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="card error-card text-center p-5">
        <div class="error-icon"><i class="fas fa-search"></i></div>
        <h1 class="display-4 fw-bold text-dark">404</h1>
        <h4 class="mb-3">Page introuvable</h4>
        <p class="text-muted mb-4">La page que vous recherchez n'existe pas ou a été déplacée.</p>
        <div>
            <a href="/" class="btn btn-dark px-4 py-2"><i class="fas fa-home me-2"></i> Retour à l'accueil</a>
        </div>
    </div>
</body>
</html>
