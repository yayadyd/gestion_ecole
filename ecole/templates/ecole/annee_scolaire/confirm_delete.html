{% extends 'ecole/base.html' %}

{% block page_title %}Confirmer la suppression{% endblock %}

{% block content %}
<div class="delete-confirm">
    <div class="card border-danger">
        <div class="card-header bg-danger text-white">
            <h5 class="mb-0">⚠️ Confirmation de suppression</h5>
        </div>
        <div class="card-body">
            <p>Êtes-vous sûr de vouloir supprimer l'année scolaire <strong>{{ object.anneeScolaire }}</strong> ?</p>
            <p class="text-danger"><small>Cette action est irréversible !</small></p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-danger">
                        <i class="fas fa-trash"></i> Supprimer
                    </button>
                    <a href="{% url 'fondamental:annee_list' %}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Annuler
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
