<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mot de passe modifié</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'vendor/fontawesome/css/all.min.css' %}">
    <style>
        :root { --core-primary: #34495e; --core-accent: #1abc9c; --core-bg: #f4f7f6; }
        body { background-color: var(--core-bg); height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; }
        .card { max-width: 400px; width: 100%; border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
        .btn-primary { background-color: var(--core-primary); border: none; }
        .btn-primary:hover { background-color: var(--core-accent); }
    </style>
</head>
<body>

<div class="card p-5">
    <i class="fas fa-check-circle fa-4x mb-3" style="color: var(--core-accent);"></i>
    <h4>Succès !</h4>
    <p class="text-muted mb-4">Votre mot de passe a été modifié avec succès.</p>
    <a href="/" class="btn btn-primary w-100">Retour à l'application</a>
</div>

</body>
</html>
