<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Supprimer l'utilisateur</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'vendor/fontawesome/css/all.min.css' %}">
    <style> body { background-color: #f4f7f6; } </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card shadow border-danger">
                <div class="card-header bg-danger text-white">
                    <h5 class="mb-0"><i class="fas fa-exclamation-triangle"></i> Confirmation</h5>
                </div>
                <div class="card-body p-4">
                    <p>Voulez-vous vraiment supprimer l'utilisateur <strong>{{ utilisateur.username }}</strong> ?</p>
                    <p class="text-muted small">Cette action est irréversible.</p>
                    <form method="post">
                        {% csrf_token %}
                        <a href="{% url 'core:utilisateur_list' %}" class="btn btn-secondary">Annuler</a>
                        <button type="submit" class="btn btn-danger">Supprimer</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
