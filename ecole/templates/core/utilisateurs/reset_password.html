<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Réinitialiser le mot de passe</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'vendor/fontawesome/css/all.min.css' %}">
    <style>
        body { background-color: #f4f7f6; }
        .btn-primary { background-color: #34495e; border: none; }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0">
                <div class="card-header bg-dark text-white">
                    <h5 class="mb-0"><i class="fas fa-key"></i> Réinitialisation</h5>
                </div>
                <div class="card-body p-4">
                    <p class="text-muted mb-3">Utilisateur : <strong>{{ utilisateur.username }}</strong></p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Nouveau mot de passe</label>
                            {{ form.new_password }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Confirmer</label>
                            {{ form.new_password_confirm }}
                        </div>
                        <div class="text-end">
                            <a href="{% url 'core:utilisateur_list' %}" class="btn btn-secondary">Annuler</a>
                            <button type="submit" class="btn btn-primary">Enregistrer</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
